[package]
name = "galaxy_generator"
version = "0.1.0"
edition = "2021"
description = "A procedural galaxy generator for games"
license = "MIT"

[dependencies]
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", optional = true }

[dev-dependencies]
criterion = "0.5"
image = "0.25"

[features]
default = []
visualization = ["image"]

[[bench]]
name = "generation"
harness = false
